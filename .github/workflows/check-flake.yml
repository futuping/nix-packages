name: Check flake

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-flake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  neomacs-package:
    name: Build Neomacs on Apple silicon
    needs: [check, python-compatibility, flogravity-package]
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://utitsoga.cachix.org
            extra-trusted-public-keys = utitsoga.cachix.org-1:vEIve6o6RwvjUotznYxEDqQmBPV8SWaOupBsA2GAq4k=

      - name: Verify Apple silicon package runner
        run: test "$(/usr/bin/uname -m)" = arm64

      - name: Test the app launcher and upstream-path updates
        run: nix build --no-link --no-update-lock-file .#checks.aarch64-darwin.neomacs-launcher

      - name: Build and smoke-test the locked Neomacs package
        run: nix run --no-update-lock-file .#neomacs-package-check

      # Crane reads generated Cargo metadata during evaluation. Realize it in
      # the native build above before the read-only no-build flake check.
      - name: Check the standalone lock and all flake outputs
        run: nix develop --no-update-lock-file .#maintainer -c nix flake check --all-systems --no-build --no-update-lock-file

      # PRs only read the public cache. Never expose the write token to them
      # or automatically upload outputs before the native checks have passed.
      - name: Publish validated Neomacs outputs to Cachix
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix run --no-update-lock-file .#push-neomacs-cache

  neomacs-cache-consumer:
    name: Verify Neomacs is downloadable without building
    needs: neomacs-package
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://utitsoga.cachix.org
            extra-trusted-public-keys = utitsoga.cachix.org-1:vEIve6o6RwvjUotznYxEDqQmBPV8SWaOupBsA2GAq4k=

      # This fresh Linux Store cannot execute a Darwin build. Empty builders
      # and zero local jobs turn every missing NAR, including Crane's IFD
      # source, into a hard failure instead of silently compiling a fallback.
      - name: Substitute the complete Apple silicon package from caches
        run: |
          nix build --no-link --no-update-lock-file \
            --max-jobs 0 --builders '' \
            .#packages.aarch64-darwin.neomacs

  flogravity-package:
    name: Build FloGravity on Apple silicon
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Verify Apple silicon package runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(/usr/bin/uname -m)" = arm64

      - name: Build and assess the locked FloGravity package
        run: nix run --no-update-lock-file .#flogravity-package-check

  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Python 3.9 is the declared compatibility floor. Python 3.14 is the
      # explicitly selected maintainer version in the locked Nix dev shell.
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test package updaters offline
        shell: bash
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail

          "$PYTHON" -c 'import os, sys; expected = tuple(map(int, os.environ["EXPECTED_PYTHON"].split("."))); assert sys.version_info[:2] == expected, (sys.version, expected)'
          "$PYTHON" -m unittest discover -s tests

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Check locked maintainer outputs for every supported system
        shell: bash
        run: |
          set -euo pipefail

          nix eval --raw .#devShells.aarch64-darwin.maintainer.drvPath >/dev/null
          nix eval --raw .#apps.aarch64-darwin.maintainer-check.program >/dev/null
          nix eval --raw .#apps.aarch64-darwin.flogravity-package-check.program >/dev/null
          nix eval --raw .#apps.aarch64-darwin.update-ego-lite.program >/dev/null
          nix eval --raw .#apps.aarch64-darwin.update-flogravity.program >/dev/null
          nix eval --raw .#apps.aarch64-darwin.update-shardx-launcher.program >/dev/null
          nix eval --raw .#apps.aarch64-darwin.update-neomacs.program >/dev/null
          nix eval --raw .#apps.aarch64-darwin.push-neomacs-cache.program >/dev/null
          nix eval --raw .#devShells.x86_64-linux.maintainer.drvPath >/dev/null
          nix eval --raw .#apps.x86_64-linux.maintainer-check.program >/dev/null

      - name: Test through the locked maintainer environment
        run: nix run --no-update-lock-file .#maintainer-check

      - name: Check locked FloGravity package, overlay, and module
        shell: bash
        run: |
          set -euo pipefail

          nix flake metadata --no-update-lock-file >/dev/null
          nix eval --raw .#packages.aarch64-darwin.flogravity.drvPath >/dev/null
          nix eval --raw .#checks.aarch64-darwin.flogravity-package.drvPath >/dev/null
          nix eval --raw .#checks.aarch64-darwin.flogravity-overlay.drvPath >/dev/null
          nix eval --json .#darwinModules.flogravity \
            --apply 'module: builtins.isFunction module || builtins.isAttrs module' \
            >/dev/null
