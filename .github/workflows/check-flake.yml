name: Check flake

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-flake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.14"

    steps:
      - uses: actions/checkout@v7

      # Python 3.9 is the declared compatibility floor. Python 3.14 is the
      # explicitly selected maintainer version in the locked Nix dev shell.
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test package updaters offline
        shell: bash
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail

          "$PYTHON" -c 'import os, sys; expected = tuple(map(int, os.environ["EXPECTED_PYTHON"].split("."))); assert sys.version_info[:2] == expected, (sys.version, expected)'
          "$PYTHON" -m unittest discover -s tests

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Check every locked flake output without building
        run: nix flake check --all-systems --no-build --no-update-lock-file

      - name: Test through the locked maintainer environment
        run: nix run --no-update-lock-file .#maintainer-check

      - name: Check locked FloGravity package, overlay, and module
        shell: bash
        run: |
          set -euo pipefail

          nix flake metadata --no-update-lock-file >/dev/null
          nix eval --raw .#packages.aarch64-darwin.flogravity.drvPath >/dev/null
          nix eval --raw .#checks.aarch64-darwin.flogravity-package.drvPath >/dev/null
          nix eval --raw .#checks.aarch64-darwin.flogravity-overlay.drvPath >/dev/null
          nix eval --json .#darwinModules.flogravity \
            --apply 'module: builtins.isFunction module || builtins.isAttrs module' \
            >/dev/null
