name: Check flake

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-flake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Test package updaters offline
        run: python3 -m unittest discover -s tests

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Check locked FloGravity package, overlay, and module
        shell: bash
        run: |
          set -euo pipefail

          nix flake metadata --no-update-lock-file >/dev/null
          nix eval --raw .#packages.aarch64-darwin.flogravity.drvPath >/dev/null
          nix eval --raw .#checks.aarch64-darwin.flogravity-package.drvPath >/dev/null
          nix eval --raw .#checks.aarch64-darwin.flogravity-overlay.drvPath >/dev/null
          nix eval --json .#darwinModules.flogravity \
            --apply 'module: builtins.isFunction module || builtins.isAttrs module' \
            >/dev/null
