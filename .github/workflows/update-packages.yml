name: Update packages

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update-packages:
    # GitHub's macos-15 label is the arm64 image; macos-15-intel is separate.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Verify Apple silicon updater runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(/usr/bin/uname -m)" = arm64

      - name: Test updaters through the locked maintainer environment
        run: nix run --no-update-lock-file .#maintainer-check

      - name: Update ego lite
        run: nix run --no-update-lock-file .#update-ego-lite

      - name: Update FloGravity
        run: nix run --no-update-lock-file .#update-flogravity

      - name: Update ShardX Launcher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix run --no-update-lock-file .#update-shardx-launcher

      - name: Validate updated FloGravity package before publishing
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- packages/flogravity-source.json; then
            echo "FloGravity did not change."
          else
            nix run --no-update-lock-file .#flogravity-package-check
          fi

      - name: Commit update or keep scheduled workflow active
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sources=(
            packages/ego-lite-source.json
            packages/flogravity-source.json
            packages/shardx-launcher-source.json
          )

          if ! git diff --quiet -- "${sources[@]}"; then
            git add "${sources[@]}"
            git commit -m "chore: update package sources"
            git push
            exit 0
          fi

          now="$(date +%s)"
          last_commit="$(git log -1 --format=%ct)"
          if (( now - last_commit >= 2592000 )); then
            git commit --allow-empty -m "chore: keep package updater active"
            git push
          else
            echo "No package update or heartbeat is due."
          fi

  update-neomacs:
    name: Update Neomacs after native validation
    needs: update-packages
    if: ${{ always() && !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      # Read main again after the binary updater's possible commit. A failing
      # Neomacs development revision cannot block or overwrite those updates.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Verify Apple silicon updater runner
        run: test "$(/usr/bin/uname -m)" = arm64

      - name: Test updaters through the locked maintainer environment
        run: nix run --no-update-lock-file .#maintainer-check

      - name: Update only Neomacs and validate its package
        run: nix run --no-update-lock-file .#update-neomacs

      - name: Validate the candidate standalone lock
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- flake.lock; then
            echo "No Neomacs candidate to validate."
          else
            # The updater has already built this candidate and its Cargo metadata.
            nix develop --no-update-lock-file .#maintainer -c nix flake check --all-systems --no-build --no-update-lock-file
          fi

      - name: Publish only a validated Neomacs lock
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- flake.lock; then
            echo "Neomacs lock did not change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- flake.lock
          git commit -m "chore: update Neomacs from main"
          git push
