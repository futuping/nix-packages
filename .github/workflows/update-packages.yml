name: Update packages

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update-packages:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Test updater
        run: python3 -m unittest discover -s tests

      - name: Update Lite XL
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_lite_xl.py

      - name: Update ego lite
        run: python3 scripts/update_ego_lite.py

      - name: Commit update or keep scheduled workflow active
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sources=(
            packages/ego-lite-source.json
            packages/lite-xl-app-source.json
          )

          if ! git diff --quiet -- "${sources[@]}"; then
            git add "${sources[@]}"
            git commit -m "chore: update package sources"
            git push
            exit 0
          fi

          now="$(date +%s)"
          last_commit="$(git log -1 --format=%ct)"
          if (( now - last_commit >= 2592000 )); then
            git commit --allow-empty -m "chore: keep package updater active"
            git push
          else
            echo "No package update or heartbeat is due."
          fi
