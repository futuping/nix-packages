name: Update packages

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  monitor-todesk:
    name: Check ToDesk stable release for manual import
    # Metadata monitoring does not need a native macOS runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Test metadata and lifecycle logic offline
        run: nix run --no-update-lock-file .#maintainer-check
      - name: Report a newer stable release without rewriting the reviewed hash
        run: nix run --no-update-lock-file .#update-todesk -- --check

  update-packages:
    name: Update binary packages on Apple silicon
    if: ${{ github.ref == 'refs/heads/main' }}
    # GitHub's macos-15 label is the arm64 image; macos-15-intel is separate.
    runs-on: macos-15
    # Reuse one native runner rather than requesting one for every package.
    # Each bounded action uses a fresh candidate checkout and publishes only
    # after its own validation, so a failed package cannot block the others.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Verify Apple silicon updater runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(/usr/bin/uname -m)" = arm64

      - name: Update ego lite
        id: ego_lite
        uses: ./.github/actions/update-binary-package
        timeout-minutes: 20
        continue-on-error: true
        with:
          package: ego-lite

      - name: Update ShardX Launcher
        id: shardx_launcher
        uses: ./.github/actions/update-binary-package
        timeout-minutes: 20
        continue-on-error: true
        with:
          package: shardx-launcher

      - name: Update WordCraft CLI
        id: wordcraft_cli
        uses: ./.github/actions/update-binary-package
        timeout-minutes: 20
        continue-on-error: true
        with:
          package: wordcraft-cli

      - name: Report every binary package outcome
        if: ${{ always() && !cancelled() }}
        env:
          EGO_OUTCOME: ${{ steps.ego_lite.outcome }}
          SHARDX_OUTCOME: ${{ steps.shardx_launcher.outcome }}
          WORDCRAFT_OUTCOME: ${{ steps.wordcraft_cli.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for package_result in \
            "ego-lite:$EGO_OUTCOME" \
            "shardx-launcher:$SHARDX_OUTCOME" \
            "wordcraft-cli:$WORDCRAFT_OUTCOME"; do
            package="${package_result%%:*}"
            package_outcome="${package_result#*:}"
            printf '%s: %s\n' "$package" "$package_outcome"
            if [[ "$package_outcome" != success ]]; then
              echo "::error::$package update did not succeed"
              failed=1
            fi
          done
          exit "$failed"

  update-neomacs:
    name: Update Neomacs after native validation
    needs: update-packages
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      # Read main again after the binary updater's possible commit. A failing
      # Neomacs development revision cannot block or overwrite those updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://utitsoga.cachix.org
            extra-trusted-public-keys = utitsoga.cachix.org-1:vEIve6o6RwvjUotznYxEDqQmBPV8SWaOupBsA2GAq4k=

      - name: Verify Apple silicon updater runner
        run: test "$(/usr/bin/uname -m)" = arm64

      - name: Test updaters through the locked maintainer environment
        run: nix run --no-update-lock-file .#maintainer-check

      - name: Update only Neomacs and validate its package
        run: nix run --no-update-lock-file .#update-neomacs

      - name: Validate the candidate standalone lock
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- flake.lock; then
            echo "No Neomacs candidate to validate."
          else
            # The updater has already built this candidate and its Cargo metadata.
            nix develop --no-update-lock-file .#maintainer -c nix flake check --all-systems --no-build --no-update-lock-file
          fi

      # Publish the cache before exposing a new lock to consumers. Upload
      # failure leaves the remote lock unchanged; an unchanged lock is cheap.
      - name: Cache the validated Neomacs candidate
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- flake.lock; then
            echo "No new Neomacs candidate to cache."
          else
            nix run --no-update-lock-file .#push-neomacs-cache
          fi

      - name: Publish only a validated Neomacs lock
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- flake.lock; then
            echo "Neomacs lock did not change."
            exit 0
          fi

          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 | tr -d '\n')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- flake.lock
          git commit -m "chore: update Neomacs from main"
          git push
